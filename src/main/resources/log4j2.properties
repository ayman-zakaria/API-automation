property.basePath=target/logs

# file appender
appender.file.type=File
appender.file.name=fileAppender
appender.file.fileName=${basePath}/log_${date:yyyy-MM-dd_HH-mm-ss}.log
appender.file.layout.type=PatternLayout
appender.file.filter.threshold.type=ThresholdFilter
appender.file.filter.threshold.level=info
appender.file.layout.pattern=[%p] - [%d{dd-MM-yyyy HH-mm-ss}] [%t] [%c] - %msg%n

# console appender
appender.console.type=Console
appender.console.name=consoleAppender
appender.console.layout.type=PatternLayout
appender.console.filter.threshold.type=ThresholdFilter
appender.console.filter.threshold.level=debug
appender.console.layout.pattern=%highlight{[%p] - [%d{dd-MM-yyyy HH-mm-ss}] [%t] [%c] - %msg}{FATAL=red, ERROR=red bold, WARN=yellow, INFO=green}%n

rootLogger.level=debug
rootLogger.appenderRefs=console, file
rootLogger.appenderRef.console.ref=consoleAppender
rootLogger.appenderRef.file.ref=fileAppender
